<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>字卡工作室 · 成品預覽</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body class="data-admin">
<header class="topbar"><a class="brand" href="/"><span class="brand-icon">Aa</span><span>字卡工作室<small>ENGLISH CARD · PREVIEW</small></span></a><span class="status"><i></i>資料庫唯讀</span><button id="refresh">↻ 更新資料</button></header>
<main>
<div class="heading"><div><span class="eyebrow">語言資料後台</span><h1>字卡資料檢查</h1><p>檢查實際詞條、來源授權與問題標記；內容修正請使用後台的詞條編輯。</p></div><button id="issue-open">⚑ 標記問題</button></div>
<div id="banner" role="status" hidden></div>
<div class="filters"><label>目標語言<select id="target"></select></label><span class="pair-arrow">→</span><label>母語<select id="native"></select></label><label class="version-label">模板版本<select id="version"><option>載入中…</option></select></label><label>資料範圍<select id="scope"><option value="full">已匯入詞條</option><option value="recall_ready">有母語釋義的詞條</option><option value="all">全部（含待補關係詞）</option></select></label><label>預覽尺寸<select id="device"><option value="portrait">手機直向</option><option value="landscape">手機橫向</option><option value="desktop">桌面</option></select></label><label class="check" hidden><input type="checkbox" id="autoplay">答案後自動播放</label></div>
<nav id="kinds" aria-label="學習模板"></nav>
<div class="workspace">
<aside class="word-panel panel"><div class="panel-title"><h2>檢查詞條</h2><span id="word-count" class="badge">—</span></div><label class="search"><span>⌕</span><input id="search" placeholder="搜尋單字、母語釋義或 ID" aria-label="搜尋詞條"></label><div id="word-list"></div><div class="list-pages"><button id="list-prev" aria-label="上一頁詞條">←</button><span id="list-page"></span><button id="list-next" aria-label="下一頁詞條">→</button></div><p class="aside-note">直接讀取目前詞庫。缺少的內容會保留狀態，不補上示範資料。</p></aside>
<section class="preview-panel"><div class="preview-toolbar"><div><span id="preview-kind">字卡預覽</span><small id="template-label"></small></div><div class="segmented"><button id="front" class="active">正面</button><button id="back">背面</button></div></div><div id="stage" class="stage portrait"><article id="card" class="study-card" aria-live="polite"><div class="empty">正在連接詞庫…</div></article></div><div class="navigation"><button id="previous">← 上一張</button><button id="random">⤨ 隨機抽樣</button><button id="next">下一張 →</button></div><p class="preview-note">僅供預覽 · 不更新 FSRS、複習紀錄或使用者能力</p></section>
<aside class="inspector panel"><div class="panel-title"><h2>資料檢查</h2><span id="quality-badge" class="badge">—</span></div><label class="sense-label">目前義項<select id="sense"></select></label><a id="edit-word" target="_top">開啟詞條編輯 →</a><div id="metadata"></div><details open><summary>資料完整性 <span id="missing-count"></span></summary><div id="missing"></div></details><details><summary>全部來源與授權</summary><div id="provenance"></div></details><details><summary>已標記問題 <span id="issue-count"></span></summary><div id="issues"></div></details><details id="layout-editor"><summary>調整預覽模板</summary><p class="aside-note">本機草稿與版本只屬於預覽工作室。正式 App 發布仍由後台整合。</p><div id="sections"></div><div id="relation-limits"></div><label class="check"><input id="show-ratings" type="checkbox" checked>顯示模擬評分</label><label class="check"><input id="show-translation" type="checkbox" checked>背面顯示母語翻譯</label><div class="editor-actions"><button id="reset-layout">恢復預設</button><button id="save-layout">儲存草稿</button><button id="publish-layout" class="primary">發布預覽版本</button></div></details></aside>
</div>
</main><div id="toast" role="status" hidden></div>
<dialog id="issue-dialog"><form id="issue-form"><div class="panel-title"><h2>標記資料問題</h2><button type="button" id="issue-close" aria-label="關閉">×</button></div><p>問題會連結到目前詞條、義項與模板版本。</p><label>問題類型<select id="issue-category"><option>資料錯誤</option><option>翻譯錯誤</option><option>圖片不符</option><option>音檔錯誤</option><option>選項不唯一</option><option>拖曳區域錯誤</option><option>版面問題</option></select></label><label>對應欄位<select id="issue-field"></select></label><label>備註<textarea id="issue-note" required maxlength="2000" rows="4" placeholder="請描述看到的問題與預期內容"></textarea></label><button class="primary" type="submit">保存問題</button></form></dialog>
</body></html>
