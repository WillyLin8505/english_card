<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>字卡工作室 · 成品預覽</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<header class="topbar"><a class="brand" href="/"><span class="brand-icon">Aa</span><span>字卡工作室<small>ENGLISH CARD · PREVIEW</small></span></a><a class="status" id="admin-link" href="http://127.0.0.1:5173/ui/#/card-data" target="_top">語言資料後台 ↗</a><button id="refresh">↻ 更新資料</button></header>
<main>
<div class="heading"><div><span class="eyebrow">先體驗，再帶進學習裡</span><h1>成品字卡預覽</h1><p>選擇內容、拖曳區塊，組合自己的字卡模板。</p></div></div>
<div id="banner" role="status" hidden></div>
<div class="filters"><label>目標語言<select id="target"></select></label><span class="pair-arrow">→</span><label>母語<select id="native"></select></label><label>我的模板<select id="template"></select></label><button id="new-template">＋ 新增模板</button><label class="version-label">模板版本<select id="version"><option>載入中…</option></select></label><label hidden>資料範圍<select id="scope"><option value="full">已匯入詞條</option><option value="recall_ready">有母語釋義的詞條</option><option value="all">全部（含待補關係詞）</option></select></label><label>預覽尺寸<select id="device"><option value="portrait">手機直向</option><option value="landscape">手機橫向</option><option value="desktop">桌面</option></select></label><label class="check"><input type="checkbox" id="autoplay">答案後自動播放</label></div>
<nav id="kinds" aria-label="學習模板"></nav>
<div class="workspace">
<aside class="word-panel panel"><div class="panel-title"><h2>預覽詞條</h2><span id="word-count" class="badge">—</span></div><label class="search"><span>⌕</span><input id="search" placeholder="搜尋單字、母語釋義或 ID" aria-label="搜尋詞條"></label><div id="word-list"></div><div class="list-pages"><button id="list-prev" aria-label="上一頁詞條">←</button><span id="list-page"></span><button id="list-next" aria-label="下一頁詞條">→</button></div></aside>
<section class="preview-panel"><div class="preview-toolbar"><div><span id="preview-kind">字卡預覽</span><small id="template-label"></small></div><div class="segmented"><button id="front" class="active">正面</button><button id="back">背面</button></div></div><div id="stage" class="stage portrait"><article id="card" class="study-card" aria-live="polite"><div class="empty">正在連接詞庫…</div></article></div><div class="navigation"><button id="previous">← 上一張</button><button id="random">⤨ 隨機抽樣</button><button id="next">下一張 →</button></div><p class="preview-note">僅供預覽 · 不更新 FSRS、複習紀錄或使用者能力</p></section>
<aside class="inspector panel"><div class="panel-title"><h2>模板編排</h2></div><label class="sense-label">預覽詞義<select id="sense"></select></label><details id="layout-editor" open><summary>拖曳組合區塊</summary><p class="aside-note">拖曳區塊到正面、背面或未使用區；拖到其他區塊前可調整順序。也可用位置選單和箭頭操作。</p><div id="sections"></div><div id="relation-limits"></div><label class="check"><input id="show-ratings" type="checkbox" checked>顯示模擬評分</label><label class="check"><input id="show-translation" type="checkbox" checked>背面顯示母語翻譯</label><div class="editor-actions"><button id="reset-layout">恢復預設</button><button id="save-layout">儲存草稿</button><button id="publish-layout" class="primary">發布預覽版本</button></div></details></aside>
</div>
</main><div id="toast" role="status" hidden></div>

<dialog id="template-dialog"><form id="template-form"><h2>新增模板</h2><label>模板名稱<input id="template-name" maxlength="80" required placeholder="例如：例句練習卡"></label><label class="check"><input id="template-clone" type="checkbox">複製目前版面</label><div class="editor-actions"><button type="button" id="template-cancel">取消</button><button type="submit" class="primary">建立模板</button></div></form></dialog></body></html>
