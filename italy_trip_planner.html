<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>義大利行程規劃器</title>
<style>
:root{
  --bg:#f6f3ee; --card:#ffffff; --ink:#1f2328; --muted:#6b7280; --line:#e4ded3;
  --accent:#b4432b; --accent-2:#2f6f5e; --warn:#b45309; --warn-bg:#fef3c7; --bad:#b91c1c; --bad-bg:#fee2e2;
  --ok-bg:#dcf0e8; --land:#e9e3d6; --chip:#efe9dc; --shadow:0 1px 3px rgba(60,40,20,.08);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#16181b; --card:#1f2327; --ink:#e8e6e1; --muted:#9aa0a6; --line:#323840;
    --accent:#ef8a6d; --accent-2:#6fc3a9; --warn:#fbbf24; --warn-bg:#3b2f10; --bad:#f87171; --bad-bg:#3d1c1c;
    --ok-bg:#183328; --land:#2a2f35; --chip:#2b3036; --shadow:none;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
header{padding:20px 16px 8px;max-width:1280px;margin:0 auto}
h1{margin:0 0 2px;font-size:24px}
.sub{color:var(--muted);font-size:13px}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px 40px}
.controls{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0 16px;display:grid;gap:12px 16px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));box-shadow:var(--shadow)}
.controls label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:4px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0;width:100%}
textarea{resize:vertical;min-height:38px}
.stepper{display:flex;gap:4px}
.stepper input{text-align:center}
.stepper button{width:38px;flex:none}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.preset{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.preset span{font-size:12px;color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:6px}.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.thumbs{display:flex;gap:4px;flex:none}.thumbs img{width:76px;height:56px;object-fit:cover;border-radius:6px;background:var(--chip);display:block}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:960px){.layout{grid-template-columns:1fr}}
#mapcol{align-self:stretch}
#mappanel{position:sticky;top:12px}
#mpFrame{width:100%;height:calc(100vh - 215px);min-height:260px;border:1px solid var(--line);border-radius:10px;background:var(--chip)}
#mpHead h3{margin:0 0 4px}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px;margin-top:8px}
@media (max-width:960px){#mapcol{position:sticky;top:0;z-index:5;order:-1}#mappanel{position:static;padding:8px}#mpFrame{height:26vh;min-height:150px}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.panel h3{margin:0 0 8px;font-size:15px}
.day{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;box-shadow:var(--shadow);overflow:hidden}
.day-h{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.day-h .dn{background:var(--accent);color:#fff;border-radius:8px;padding:2px 10px;font-weight:700}
.day-h .date{color:var(--muted);font-size:13px}
.day-h select{width:auto;font-weight:600}
.day-h .sp{flex:1}
.day-h .brief{font-size:12px;color:var(--muted)}
.day-b{padding:12px 14px;display:grid;gap:12px}
.collapsed .day-b{display:none}
.transfer{background:var(--ok-bg);border-radius:10px;padding:9px 12px;font-size:13px}
.note-line{font-size:13px;color:var(--muted)}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--chip);margin-left:4px;white-space:nowrap}
.badge.r{background:var(--warn-bg);color:var(--warn)}
.badge.x{background:var(--bad-bg);color:var(--bad)}
h4{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.attr{display:flex;gap:9px;align-items:flex-start;padding:7px 8px;border-radius:8px;cursor:pointer}
.attr:hover{background:var(--chip)}
.attr input{width:18px;height:18px;margin-top:3px;flex:none;accent-color:var(--accent)}
.attr .main{flex:1;min-width:0}
.attr .meta{font-size:12px;color:var(--muted)}
.attr a,.link{color:var(--accent-2);font-size:12px;text-decoration:none}
.attr a:hover,.link:hover{text-decoration:underline}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
.hotel-card{border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13px;margin-top:6px}
.rest{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.rest:last-child{border:0}
.rest .main{flex:1;min-width:0}
.rest .meta{color:var(--muted);font-size:12px}
.mbtn{padding:2px 8px;font-size:12px;border-radius:99px}
.mbtn.on{background:var(--accent-2);color:#fff;border-color:var(--accent-2)}
.timeline{font-size:13px;display:grid;gap:2px}
.slot{display:flex;gap:10px}
.slot .t{width:96px;flex:none;color:var(--muted);font-variant-numeric:tabular-nums}
.slot.move .l{color:var(--accent-2)}
.slot.meal .l{color:var(--warn)}
.bar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--accent-2)}
.bar.over i{background:var(--bad)}
.alert{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:6px 10px;font-size:13px}
.alert.bad{background:var(--bad-bg);color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:13px}
td{padding:3px 0}
td:last-child{text-align:right;font-variant-numeric:tabular-nums}
tr.total td{border-top:1px solid var(--line);font-weight:700;padding-top:6px}
.small{font-size:12px;color:var(--muted)}
.resv li{margin:2px 0;font-size:13px}
svg.map{width:100%;height:auto;display:block}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.2s}
.toast.show{opacity:1}
@media print{
  .controls,aside .noprint,.mbtn,button{display:none!important}
  .layout{grid-template-columns:1fr} #mappanel{position:static}
  .collapsed .day-b{display:grid}
  body{background:#fff}
}
</style>
</head>
<body>
<header>
  <h1>🇮🇹 義大利行程規劃器</h1>
  <div class="sub">調整天數 → 為每天選城市 → 勾選景點 → 挑飯店與餐廳。右側即時估算時間與預算。所有設定會自動存在這個瀏覽器。</div>
</header>
<div class="wrap">
  <section class="controls" id="controls">
    <label>旅行天數
      <div class="stepper"><button id="dMinus" aria-label="減少一天">−</button><input id="days" type="number" min="1" max="30"><button id="dPlus" aria-label="增加一天">＋</button></div>
    </label>
    <label>出發日期（可不填）<input id="start" type="date"></label>
    <label>人數<input id="pax" type="number" min="1" max="12"></label>
    <label>步調
      <select id="pace"><option value="relaxed">悠閒（約 17:30 收工）</option><option value="normal">標準（約 19:00 收工）</option><option value="packed">緊湊（約 21:00 收工）</option></select>
    </label>
    <label>住宿偏好
      <select id="tier"><option value="1">經濟</option><option value="2">中等</option><option value="3">高級</option></select>
    </label>
    <label>旅遊季節（影響房價）
      <select id="season"><option value="0.8">淡季 11–2 月</option><option value="1">平季 3–4、10 月</option><option value="1.3">旺季 5–9 月</option></select>
    </label>
    <label>1 歐元 ≈ 台幣<input id="twd" type="number" step="0.1" min="1"></label>
    <div class="preset">
      <span>行程方案（各自獨立保存，切換不會互相覆蓋）：</span>
      <div id="tabs" class="tabs"></div>
    </div>
    <div class="preset">
      <span id="presetDesc" class="small"></span>
      <button id="regenBtn">依目前步調重新自動排這個方案</button>
      <button id="resetBtn">全部重設</button>
    </div>
  </section>

  <div class="layout">
    <main id="days-list"></main>
    <aside id="mapcol"><div class="panel" id="mappanel"><div id="mpHead"></div><iframe id="mpFrame" title="當日景點地圖" referrerpolicy="no-referrer-when-downgrade"></iframe></div></aside>
  </div>
  <section id="summary" class="sumgrid"></section>
  <p class="small">⚠ 景點縮圖由維基百科搜尋自動帶入（免費、CC 授權，點圖可看來源與授權），偶爾會抓到相近但不完全相同的圖。景點門票、房價、車程與餐廳均為概估，實際價格與營業時間請於出發前確認（熱門景點務必提早預約）。飯店與餐廳名單為參考起點，請以 Google 地圖最新評價為準。機票、旅遊保險、城市稅（Tassa di soggiorno，每人每晚約 €2–7）未計入預算。</p>
</div>
<div class="toast" id="toast"></div>

function hav(a,b){const R=6371,r=x=>x*Math.PI/180;const dLa=r(b.lat-a.lat),dLo=r(b.lon-a.lon);
 const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function transfer(a,b){
 if(a===b)return null;
 const p=PAIRS[[a,b].sort().join('|')];
 if(p)return{h:p[0],mode:p[1],lo:p[2],hi:p[3],tip:p[4],est:false};
 const d=hav(CITIES[a],CITIES[b]);
 return{h:Math.round((d*1.3/90+0.6)*10)/10,mode:'🚆 火車／巴士（概估，請查時刻表）',lo:Math.round(d*.08),hi:Math.round(d*.16),tip:'',est:true};
}

function allocate(w,n){
 let ks=Object.keys(w).slice(0,n);const tot=ks.reduce((a,k)=>a+w[k],0);
 const al={};ks.forEach(k=>al[k]=Math.max(1,Math.floor(n*w[k]/tot)));
 const sum=()=>ks.reduce((a,k)=>a+al[k],0);
 while(sum()<n){const k=ks.reduce((b,k)=>(n*w[k]/tot-al[k])>(n*w[b]/tot-al[b])?k:b);al[k]++}
 while(sum()>n){const k=ks.filter(k=>al[k]>1).reduce((b,k)=>(n*w[k]/tot-al[k])<(n*w[b]/tot-al[b])?k:b,ks.find(k=>al[k]>1));if(!k)break;al[k]--}
 return ks.flatMap(k=>Array(al[k]).fill(k));
}
/* 自動勾選：依步調填滿一天，同城市前幾天已選過的不重複；偏好標籤優先 */
function fillDay(i){
 const d=S.plan[i],c=CITIES[d.city],pref=(PRESETS[S.cur]||{}).prefer||[],dt=dateOf(i);
 const used=new Set(S.plan.slice(0,i).filter(x=>x.city===d.city).flatMap(x=>x.picks));
 const rank=a=>(pref.includes(a.t)?0:1)+(a.h>=6?10:0);
 const cands=c.attractions.filter(a=>!used.has(a.id)&&!(dt&&a.x&&a.x.includes(dt.getDay())))
   .map((a,idx)=>({a,idx})).sort((p,q)=>rank(p.a)-rank(q.a)||p.idx-q.idx).map(o=>o.a);
 d.picks=[];
 for(const a of cands){
  if(d.picks.length>=7)break;
  if(a.h>=6&&d.picks.length)continue;
  d.picks.push(a.id);
  if(dayCalc(i).end>PACE[S.pace]){d.picks.pop();continue}
  if(a.h>=6)break;
 }
 const prior=S.plan.slice(0,i).filter(x=>x.city===d.city);
 const pick=(m,key)=>{const r=c.rests.find(r=>r.meal.includes(m)&&!prior.some(x=>x[key]===r.id));return r?r.id:''};
 d.lunch=pick('L','lunch');d.dinner=pick('D','dinner');
 if(d.lunch&&d.lunch===d.dinner)d.dinner='';
}

}

 S.store[S.cur]={n:S.n,plan:S.plan};S.cur=key;

}

 const d=S.plan[i],hs=CITIES[d.city].hotels;
 if(d.hotel){const h=hs.find(h=>h.id===d.hotel);if(h)return h}
 if(i>0&&S.plan[i-1].city===d.city)return hotelOf(i-1);

}

function dayCalc(i){
 const d=S.plan[i],c=CITIES[d.city];
 const prev=i>0?S.plan[i-1].city:null;
 const tr=prev&&prev!==d.city?transfer(prev,d.city):null;
 const slots=[];let t=i===0?14:9;
 if(tr){slots.push({s:t,e:t+tr.h,l:`移動：${CITIES[prev].name} → ${c.name}`,k:'move'});t+=tr.h;
  slots.push({s:t,e:t+0.75,l:'抵達、寄放行李／辦理入住',k:'move'});t+=0.75;}
 const items=c.attractions.filter(a=>d.picks.includes(a.id));
 let lunch=false,first=true;
 for(const a of items){
  if(!first)t+=0.4;
  if(!lunch&&t>=12){slots.push({s:t,e:t+1,l:'午餐',k:'meal'});t+=1;lunch=true}
  slots.push({s:t,e:t+a.h,l:a.n,k:'a'});t+=a.h;first=false;
 }
 if(!lunch&&items.length){t=Math.max(t,12);slots.push({s:t,e:t+1,l:'午餐',k:'meal'});t+=1}
 const end=t;
 const ds=Math.max(t+0.3,19.5);
 const limit=PACE[S.pace];
 const startT=i===0?14:9;
 const attrH=items.reduce((a,x)=>a+x.h,0);
 const tickets=items.reduce((a,x)=>a+x.c,0);
 return{tr,slots,items,end,dinner:{s:ds,e:ds+1.5},limit,startT,attrH,tickets,over:items.length&&end>limit,
  pct:Math.min(100,(end-startT)/(limit-startT)*100)};

function budgetCalc(){
 const rooms=Math.ceil(S.pax/2),defL=[12,18,30][S.tier-1],defD=[20,32,65][S.tier-1];
 const B={hotel:0,transport:0,tickets:0,meals:0,local:0,days:[]};
 S.plan.forEach((d,i)=>{
  const k=dayCalc(i),h=hotelOf(i);
  const hotel=i<S.n-1?h.p*S.season*rooms:0;
  const tr=k.tr?(k.tr.lo+k.tr.hi)/2*S.pax:0;
  const tickets=k.tickets*S.pax;
  const l=restOf(d.city,d.lunch),dn=restOf(d.city,d.dinner);
  const meals=((l?l.p:defL)+(dn?dn.p:defD))*S.pax;
  const local=6*S.pax;
  B.hotel+=hotel;B.transport+=tr;B.tickets+=tickets;B.meals+=meals;B.local+=local;
  B.days.push({hotel,tr,tickets,meals,local,all:hotel+tr+tickets+meals+local});
 });
 B.total=B.hotel+B.transport+B.tickets+B.meals+B.local;
 return B;
}

}
async function fetchThumbs(q){
 const url='https://zh.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=5&prop=pageimages&piprop=thumbnail&pithumbsize=240&pilimit=5&gsrsearch='+encodeURIComponent(q);
 const r=await fetch(url);const j=await r.json();
 const pg=Object.values((j.query&&j.query.pages)||{}).filter(p=>p.thumbnail).sort((a,b)=>a.index-b.index).slice(0,2);
 return pg.map(p=>({id:p.pageid,t:p.title,u:p.thumbnail.source}));
}
function pumpImgs(){
 while(imgBusy<3&&imgQueue.length){
  const el=imgQueue.shift(),q=el.dataset.q;imgBusy++;
  fetchThumbs(q).then(list=>{IMG[q]=list;try{localStorage.setItem(IMGK,JSON.stringify(IMG))}catch(e){}if(el.isConnected)paintThumbs(el,list)},()=>{}).finally(()=>{imgBusy--;pumpImgs()});
 }
}
let imgObs;
function loadThumbs(){
 if(!imgObs)imgObs=new IntersectionObserver(es=>es.forEach(en=>{if(!en.isIntersecting)return;imgObs.unobserve(en.target);imgQueue.push(en.target);pumpImgs()}),{rootMargin:'300px'});
 document.querySelectorAll('.thumbs').forEach(el=>{const q=el.dataset.q;if(IMG[q])paintThumbs(el,IMG[q]);else imgObs.observe(el)});
}
let activeDay=0;
function pickActive(){let a=0;document.querySelectorAll('.day').forEach((e,i)=>{if(e.getBoundingClientRect().top<=170)a=i});return a}
function updateMap(){
 if(activeDay>=S.n)activeDay=S.n-1;
 const i=activeDay,d=S.plan[i],c=CITIES[d.city],st=stopsOf(i),e=encodeURIComponent,dt=dateOf(i);
 let src,link;
 if(st.length>1){
  src=`https://maps.google.com/maps?saddr=${e(st[0])}&daddr=${e(st.slice(1).join(' to:'))}&dirflg=w&output=embed`;
  link=`https://www.google.com/maps/dir/?api=1&travelmode=walking&origin=${e(st[0])}&destination=${e(st[st.length-1])}${st.length>2?'&waypoints='+e(st.slice(1,-1).join('|')):''}`;
 }else if(st.length===1){src=`https://maps.google.com/maps?q=${e(st[0])}&output=embed`;link=mapQ(st[0])}
 else{src=`https://maps.google.com/maps?q=${e(c.name+' Italy')}&output=embed`;link=mapQ(c.name+' Italy')}
 const nm=x=>x.replace(/ [^ ]+ Italy$/,'');
 $('#mpHead').innerHTML=`<h3>Day ${i+1}　${c.name}${dt?`　<span class="small">${dt.getMonth()+1}/${dt.getDate()}（週${WD[dt.getDay()]}）</span>`:''}</h3>
  <div class="small" style="margin-bottom:6px">${st.length?st.map((x,k)=>`<span class="badge">${k+1} ${nm(x)}</span>`).join(' '):'這天還沒勾選景點，顯示城市地圖'}　<a class="link" target="_blank" rel="noopener" href="${link}">在 Google 地圖開啟 ↗</a></div>`;
 const f=$('#mpFrame');if(f.dataset.src!==src){f.dataset.src=src;f.src=src}
}
function render(){
 $('#days-list').innerHTML=S.plan.map((_,i)=>dayHTML(i)).join('');
 $('#summary').innerHTML=summaryHTML();
 $('#days').value=S.n;
 updateMap();loadThumbs();
 $('#tabs').innerHTML=Object.entries(PRESETS).map(([k,p])=>`<button data-k="${k}" class="${k===S.cur?'on':''}">${p.name}</button>`).join('');
 $('#presetDesc').textContent=PRESETS[S.cur].desc;
}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}

function exportText(){
 const B=budgetCalc();const L=[`義大利行程 ${S.n} 天（${S.pax} 人）`,''];
 S.plan.forEach((d,i)=>{const c=CITIES[d.city],k=dayCalc(i),dt=dateOf(i);
  L.push(`Day ${i+1}${dt?` ${dt.getMonth()+1}/${dt.getDate()}（週${WD[dt.getDay()]}）`:''}　${c.name}`);
  if(k.tr)L.push(`  交通：${CITIES[S.plan[i-1].city].name} → ${c.name}，${k.tr.mode.replace(/[^一-龥A-Za-z／ ]/g,'')}約 ${dur(k.tr.h)}，約 €${k.tr.lo}–${k.tr.hi}／人`);
  if(i<S.n-1)L.push(`  住宿：${hotelOf(i).n}（${hotelOf(i).area}）`);
  k.slots.forEach(s=>L.push(`  ${fm(s.s)}–${fm(s.e)} ${s.l}`));
  const l=restOf(d.city,d.lunch),dn=restOf(d.city,d.dinner);
  if(l)L.push(`  午餐：${l.n}`);if(dn)L.push(`  晚餐：${dn.n}`);
  if(d.note)L.push(`  備註：${d.note}`);L.push('')});
 L.push(`預算合計約 €${Math.round(B.total)}（約 NT$ ${Math.round(B.total*S.twd).toLocaleString()}）`);
 return L.join('\n');
}

/* ============ 事件 ============ */
function setDays(n){
 n=Math.max(1,Math.min(30,Math.round(n)||1));
 while(S.plan.length<n){S.plan.push(newDay(S.plan.length?S.plan[S.plan.length-1].city:'rome'));if(!PRESETS[S.cur].blank)fillDay(S.plan.length-1)}
 S.plan.length=n;S.n=n;
}
function syncControls(){
 $('#days').value=S.n;$('#start').value=S.start;$('#pax').value=S.pax;$('#pace').value=S.pace;
 $('#tier').value=S.tier;$('#season').value=S.season;$('#twd').value=S.twd;
}
function init(){
 S=load()||defaultState();

 $('#tabs').onclick=e=>{const b=e.target.closest('[data-k]');if(!b||b.dataset.k===S.cur)return;switchTo(b.dataset.k);syncControls();save();render();window.scrollTo({top:0})};
 syncControls();render();
 const upd=()=>{save();render()};
 $('#dMinus').onclick=()=>{setDays(S.n-1);upd()};
 $('#dPlus').onclick=()=>{setDays(S.n+1);upd()};
 $('#days').onchange=e=>{setDays(+e.target.value);upd()};
 $('#start').onchange=e=>{S.start=e.target.value;upd()};
 $('#pax').onchange=e=>{S.pax=Math.max(1,Math.min(12,+e.target.value||1));syncControls();upd()};
 $('#pace').onchange=e=>{S.pace=e.target.value;upd()};
 $('#tier').onchange=e=>{S.tier=+e.target.value;upd()};
 $('#season').onchange=e=>{S.season=+e.target.value;upd()};
 $('#twd').onchange=e=>{S.twd=+e.target.value||35;upd()};
 $('#regenBtn').onclick=()=>{if(S.plan.some(d=>d.picks.length)&&!confirm('會依目前步調重新勾選這個方案的景點與餐廳，確定嗎？'))return;autoFillAll();upd();toast('已重新自動排')};
 $('#resetBtn').onclick=()=>{if(confirm('清除所有方案並回到預設？')){defaultState();syncControls();upd()}};
 let tick=false;
 window.addEventListener('scroll',()=>{if(tick)return;tick=true;requestAnimationFrame(()=>{tick=false;const a=pickActive();if(a!==activeDay){activeDay=a;updateMap()}})},{passive:true});
 const list=$('#days-list');
 list.addEventListener('change',e=>{
  const t=e.target,a=t.dataset.a,i=+t.dataset.i;if(!a)return;activeDay=i;const d=S.plan[i];
  if(a==='city'){d.city=t.value;d.picks=[];d.hotel='';d.lunch='';d.dinner='';if(!PRESETS[S.cur].blank)fillDay(i)}
  else if(a==='pick'){const id=t.dataset.id;d.picks=t.checked?[...d.picks,id]:d.picks.filter(x=>x!==id)}
  else if(a==='hotel'){d.hotel=t.value}
  else if(a==='note'){d.note=t.value;save();return}
  upd();
 });
 list.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,i=+t.dataset.i;activeDay=i;
  if(a==='autofill'){fillDay(+t.dataset.i);upd()}
  else if(a==='clear'){S.plan[+t.dataset.i].picks=[];upd()}
  else if(a==='meal'){const d=S.plan[i],k=t.dataset.k,id=t.dataset.id;d[k]=d[k]===id?'':id;upd()}
  else if(a==='toggle'&&!e.target.closest('select')){S.plan[i].collapsed=!S.plan[i].collapsed;save();render()}
 });
 $('#summary').addEventListener('click',e=>{
  if(e.target.id==='copyBtn'){const txt=exportText();
   (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('已複製'),()=>{prompt('請手動複製：',txt)})}
 });
}
init();
</script>
</body>
</html>
